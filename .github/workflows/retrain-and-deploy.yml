# File: .github/workflows/retrain-and-deploy.yml
name: Retrain and Deploy Model

on:
  schedule:
    - cron: "0 5 * * 1" # Every Monday at 05:00 UTC
  workflow_dispatch:      # Manual trigger available via GitHub UI

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}

jobs:
  retrain-and-deploy:
    name: Weekly Model Retraining & Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🧩 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: ☁️ Install Azure ML CLI
        run: |
          az extension add -n ml --yes || az extension update -n ml
          az configure --defaults workspace=mlops-scotia-ws2 group=mlops-rg

      - name: 🧠 Retrain Model
        run: |
          echo "Starting model retraining..."
          python src/train.py \
            --features data/features/feat_v1.parquet \
            --output_dir models/run_local

      - name: 🗂️ Register Model in Azure ML
        run: |
          az ml model create \
            --name fraud-detection-model \
            --path models/run_local/model.joblib \
            --workspace-name mlops-scotia-ws2 \
            --resource-group mlops-rg

      - name: 🚀 Redeploy Model Endpoint
        run: |
          az ml online-deployment update \
            --name fraud-deployment \
            --endpoint-name scotia-fraud-detection-endpoint \
            --workspace-name mlops-scotia-ws2 \
            --resource-group mlops-rg \
            --file deployment.yml

      - name: Get Scoring URI
        id: get_uri
        run: |
          URI=$(az ml online-endpoint show \
            --name scotia-fraud-detection-endpoint \
            --workspace-name mlops-scotia-ws2 \
            --resource-group mlops-rg \
            --query "scoring_uri" -o tsv)
          echo "uri=$URI" >> $GITHUB_OUTPUT

      - name: Smoke Test Endpoint
        env:
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          ENDPOINT_URI: ${{ steps.get_uri.outputs.uri }}
        run: |
          echo "🚀 Running post-deployment health check..."

          # Validate required secrets
          if [ -z "$AZURE_API_KEY" ]; then
            echo "❌ Missing AZURE_API_KEY secret!"
            exit 1
          fi

          # Ensure test data exists
          if [ ! -f "test_data.json" ]; then
            echo "❌ test_data.json not found!"
            exit 1
          fi

          # Call the endpoint
          echo "🌐 Invoking endpoint: $ENDPOINT_URI"
          curl -X POST "$ENDPOINT_URI" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $AZURE_API_KEY" \
            -d "@test_data.json" \
            --fail -o response.json -s

          echo "✅ Smoke test succeeded! Endpoint response:"
          cat response.json

                echo "Running post-deployment health check..."

                # Validate required secrets
                if [ -z "${{ secrets.AZURE_API_KEY }}" ]; then
                  echo "❌ Missing AZURE_API_KEY secret!"
                  exit 1
                fi

                # Ensure test data exists
                if [ ! -f "test_data.json" ]; then
                  echo "❌ test_data.json not found!"
                  exit 1
                fi

                # Call the endpoint
                echo "Invoking endpoint: ${{ steps.get_uri.outputs.uri }}"
                curl -X POST "${{ steps.get_uri.outputs.uri }}" \
                  -H "Content-Type: application/json" \
                  -H "Authorization: Bearer ${{ secrets.AZURE_API_KEY }}" \
                  -d "@test_data.json" \
                  --fail -o response.json -s

                echo "✅ Smoke test succeeded! Endpoint response:"
                cat response.json

      - name: 📤 Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-deploy-logs
          path: models/run_local/

      - name: ✅ Notify Success
        if: success()
        run: echo "✅ Model retraining and deployment completed successfully."

      - name: ⚠️ Notify Failure
        if: failure()
        run: echo "❌ Retrain or deployment failed. Please check workflow logs."
