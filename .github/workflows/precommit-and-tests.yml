name: Pre-commit and Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/pip
                      ~/.cache/pypoetry
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pre-commit-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                                    # Install runtime dependencies so pytest (run by pre-commit) can import project packages
                                    if [ -f requirements.txt ]; then pip install -r requirements.txt --cache-dir ~/.cache/pip; fi
                  # Prefer a plain requirements-dev.txt on CI (cross-platform). If it's present, use it.
                  if [ -f requirements-dev.txt ]; then
                      pip install --no-deps -r requirements-dev.txt --cache-dir ~/.cache/pip
                  elif [ -f requirements-dev.lock ]; then
                      # Fallback for projects that only committed a lockfile. Be careful: lockfiles
                      # generated on Windows can contain platform-only packages (pywin32) that
                      # fail on Linux runners. Prefer keeping requirements-dev.txt cross-platform.
                      pip install --no-deps -r requirements-dev.lock --cache-dir ~/.cache/pip
                  fi
                  # ensure formatter/linter/test tools are present
                  pip install --cache-dir ~/.cache/pip pre-commit black isort flake8 flake8-bugbear pytest

            - name: Run pre-commit hooks (format/lint/tests)
              run: |
                  # run formatters/linters first
                  pre-commit run --all-files

            - name: Run pytest
              run: |
                  python -m pytest -q
