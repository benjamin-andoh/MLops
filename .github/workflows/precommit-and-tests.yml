name: Pre-commit and Tests

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.10"

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.cache/pip
                      ~/.cache/pypoetry
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-

            - name: Cache pre-commit
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: ${{ runner.os }}-pre-commit-${{ hashFiles('**/.pre-commit-config.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pre-commit-

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  if [ -f requirements-dev.lock ]; then pip install --no-deps -r requirements-dev.lock --cache-dir ~/.cache/pip; fi
                  # ensure formatter/linter/test tools are present
                  pip install --cache-dir ~/.cache/pip pre-commit black isort flake8 flake8-bugbear pytest

            - name: Run pre-commit hooks (format/lint/tests)
              run: |
                  # run formatters/linters first
                  pre-commit run --all-files

            - name: Run pytest
              run: |
                  python -m pytest -q
