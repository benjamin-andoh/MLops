---
name: CI

on:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest -q || true

      - name: Build Docker image
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: |
          # Use a safe, valid image tag. If ACR_NAME is not provided, fall back to local image name 'fraud-model'
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          if [ -n "$ACR_NAME" ]; then
            IMAGE_TAG="$ACR_NAME/fraud-model:ci-$SHORT_SHA"
          else
            IMAGE_TAG="fraud-model:ci-$SHORT_SHA"
          fi

          echo "Building Docker image with tag: $IMAGE_TAG"
          docker build -t "$IMAGE_TAG" .
          echo "docker build done"

      - name: Push image to ACR
        if: always()
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          # Only attempt login and push if ACR variables are set
          if [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "ACR credentials or names not set; skipping push to ACR"
            exit 0
          fi

          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-12)
          LOCAL_IMAGE="$ACR_NAME/fraud-model:ci-$SHORT_SHA"
          REMOTE_IMAGE="$ACR_LOGIN_SERVER/$ACR_NAME/fraud-model:ci-$SHORT_SHA"

          # Perform non-interactive docker login using --password-stdin
          echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" -u "$ACR_USERNAME" --password-stdin

          # Tag and push
          docker tag "$LOCAL_IMAGE" "$REMOTE_IMAGE"
          docker push "$REMOTE_IMAGE"
